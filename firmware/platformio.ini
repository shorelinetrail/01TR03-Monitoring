; PlatformIO Project Configuration File
; 01TR03 Transformer Temperature Monitoring System

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino

; Serial monitor
monitor_speed = 115200

; Build optimization
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; Library dependencies
lib_deps =
    olikraus/U8g2@^2.35.9
    adafruit/Adafruit MCP9600 Library@^2.0.1

; Upload settings
upload_speed = 921600

; Partition scheme (default with OTA support)
board_build.partitions = default.csv

; Additional libraries search paths
lib_ldf_mode = chain+
